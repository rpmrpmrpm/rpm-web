<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rpm playback test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #101014; color: #eee; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  button, select { font: inherit; padding: 12px 16px; margin: 4px 4px 4px 0; border-radius: 10px; border: 0; background: #2a2a33; color: #fff; }
  #log { margin-top: 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: #bbb; }
</style>
</head>
<body>
<h1>rpm playback test</h1>
<div id="title">Press Play</div>
<div id="where">&nbsp;</div>
<select id="set">
  <option value="flac">FLAC album</option>
  <option value="mp3">MP3 album</option>
  <option value="aac128">128 AAC album</option>
</select>
<button id="play">Play</button>
<button id="toggle">Pause</button>
<button id="next">Next</button>
<div id="log"></div>
<script type="module" src="./proof.ts"></script>
</body>
</html>
